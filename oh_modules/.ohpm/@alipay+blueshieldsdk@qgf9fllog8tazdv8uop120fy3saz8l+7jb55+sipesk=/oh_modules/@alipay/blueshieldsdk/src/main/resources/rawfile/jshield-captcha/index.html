let shouldShowCaptchaConfig = {}

  resetRem('0.6px')

    const root = document.documentElement
    root.style.fontSize = size

function initCaptcha() {
  loadScript(globalConfig.captchaCoreUrl, function (isSuccess) {
    console.log("isSuccess : " + isSuccess)
    if (isSuccess) {
      // @ts-ignore
    //   APSecuritySdk.init('jshield-native', {
    //     captcha: true
    //   });
      loadSuccess = true;
      // 等待队列中有需要显示的验证码
      if (shouldShowCaptchaConfig && shouldShowCaptchaConfig.captchaId) {
        showCaptcha(shouldShowCaptchaConfig.captchaId, shouldShowCaptchaConfig.host, shouldShowCaptchaConfig.config);

    }
  }, globalConfig.timeOut)

async function showCaptcha(captchaId, host, config) {
  if (!loadSuccess) {
      // 还未加载完成，记录下参数，等加载完成后调用
      shouldShowCaptchaConfig = {
          captchaId,
          host,
          config,
      }
      return
  }
  var instance = captchas[captchaId]
  if (!instance) {
      instance = await new Promise(resolve => {
          console.log('createCaptcha')
          APCaptcha.createCaptcha({
              captchaId, // AIGC-图标点选
              host,
              useNativeButton: false,
              width,
              ...config
          }, (captchaObj) => {
              console.log('==== 收到 验证码 成功回调 ====')
              captchaObj
                  .onSuccess(function (data) {
                      console.log('onSuccess: ' + captchaId);
                      WebViewJavascriptBridge.callHandler('success', {captchaId, data});
                  })
                  .onReady(function () {
                      console.log('onReady: ' + captchaId);
                      WebViewJavascriptBridge.callHandler('ready', {captchaId});

                      clearID && clearTimeout(clearID);
                      const loadingElm = document.getElementById('jshield_captcha_loading')
                      if (loadingElm) {
                        loadingElm.style.display = 'none';
                      }
                  })
                  .onClose(function () {
                      console.log('onClose: ' + captchaId);
                      WebViewJavascriptBridge.callHandler('close', {captchaId});
                  })
                  .onError(function (e) {
                      console.log('onError: ' + captchaId);
                      WebViewJavascriptBridge.callHandler('error', {captchaId, error: JSON.stringify(e)});
                  })

              captchaObj.appendTo('')
              captchas[captchaId] = captchaObj
              resolve(captchaObj)
          })
      })
  }

  if (config && config.params) {

    instance.addExtra(JSON.parse(config.params))
  }

  console.log('do showCaptcha')
  instance.showCaptcha();
}

function src_onload(bridge) {
  var startTime = 0;
  var captcha = document.getElementById('captcha');
  var img = document.getElementById('jshield_captcha_loading_img');

  var query = location.href.split('?')[1] || '';

  bridge.registerHandler("showCaptcha", function(data, responseCallback) {
      console.log('showCaptcha called: ' + data)
      const config = JSON.parse(data)
      // 检查必要参数
      if (!config) {
          console.log('args error: config null');
          responseCallback({success: false});
          return;
      }
      if (!config['captchaId']) {
          console.log('args error: captchaId null');
          responseCallback({success: false});
          return;
      }
      if (!config['host']) {
          console.log('args error: host null');
          responseCallback({success: false});
          return;
      }
      const newConfig = {
        ...globalConfig,
        ...config
      }
      showCaptcha(config['captchaId'], config['host'], newConfig)
      responseCallback({success: true});
      return;
  });

  function setDebug() {
      debug = true;
      logEle.className = 'log';
  }

  function paseURI() {
      return JSON.parse(decodeURIComponent(query.split('=')[1]));
  }

  function checkArgs(args) {
      // 检查必要参数
      if (!args['captchaCoreUrl']) {
        WebViewJavascriptBridge.callHandler('error', {error: 'captchaCoreUrl invalid'});
        return false
      }

      //设置loading
      if(args['loading']){
        img.src = args['loading'];
        clearID = setTimeout(function () {
          img.style.display = 'inline-block';
        }, 200);
      }
      // 是否开启debug
      if (args['debug']) {
          setDebug(true);
          startTime = (new Date()).getTime();
          console.log(JSON.stringify(args))
      }

      // 设置title
      if (args['title'] && args['title'] != "") {
          var h3 = document.createElement('h3');
          h3.className = 'title';
          h3.appendChild(document.createTextNode(decodeURIComponent(args['title'])));
          captcha.appendChild(h3);
      }

      window.isCanceledOnTouchOutside = args['isCanceledOnTouchOutside']
      if (args['isCanceledOnTouchOutside'] && JSON.stringify(args['isCanceledOnTouchOutside']) == 'true') {
          const captchaElement = document.querySelector('.page-container.captcha');
          captchaElement && captchaElement.addEventListener('click', () => {
            WebViewJavascriptBridge.callHandler('close', {});
          })

          document.addEventListener('click', () => {
            WebViewJavascriptBridge.callHandler('close', {});
          })
      }
      return true
  }

  function mergeOptions(args) {
      for (var k in args) {
          if (args.hasOwnProperty(k) &&
              ['debug', 'title',  args['type']].indexOf(k) === -1) {
              globalConfig[k] = args[k];
          }
      }
  }

  // 解析参数
  var args = query ? paseURI(query) : {};

  // 检查参数
  if (checkArgs(args)) {
    // 合并配置项
    mergeOptions(args);
    initCaptcha();
  }

};
